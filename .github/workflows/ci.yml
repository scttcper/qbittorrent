name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Current release, the previous minor and the last v4, version gated
        # tests skip whatever the older images don't support.
        qbittorrent: ['5.3.0-2', '5.2.4-1', '4.6.7-1']
    name: build (qBittorrent ${{ matrix.qbittorrent }})
    steps:
      # https://github.com/actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # https://github.com/pnpm/action-setup
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # https://github.com/actions/setup-node
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: start qbittorrent
        run: |
          # The official image stores config under /config/qBittorrent/config.
          # v4 images read QBT_EULA instead of QBT_LEGAL_NOTICE, and don't
          # accept Basic auth, so wait for the server with a form login.
          mkdir -p /tmp/qbittorrent/config/qBittorrent/config /tmp/qbittorrent/downloads
          cat > /tmp/qbittorrent/config/qBittorrent/config/qBittorrent.conf << 'EOF'
          [BitTorrent]
          Session\DefaultSavePath=/downloads
          Session\Port=6881
          Session\QueueingSystemEnabled=false
          Session\TempPath=/downloads/temp

          [Meta]
          MigrationVersion=6

          [Preferences]
          WebUI\Password_PBKDF2="@ByteArray(ARQ77eY1NUZaQsuDHbIMCA==:0WMRkYTUWVT9wVvdDtHAjU9b3b7uB8NR1Gur2hmQCvCDpm39Q+PsJRJPaCU51dEiz+dTzh8qbPsL8WkFljQYFQ==)"
          WebUI\Port=8080
          EOF
          docker run -d \
            --name qbittorrent \
            -e QBT_LEGAL_NOTICE=confirm \
            -e QBT_EULA=accept \
            -e QBT_WEBUI_PORT=8080 \
            -e QBT_TORRENTING_PORT=6881 \
            -e PUID="$(id -u)" \
            -e PGID="$(id -g)" \
            -p 8080:8080 \
            -p 6881:6881 \
            -p 6881:6881/udp \
            -v /tmp/qbittorrent/config:/config \
            -v /tmp/qbittorrent/downloads:/downloads \
            qbittorrentofficial/qbittorrent-nox:${{ matrix.qbittorrent }}
          for i in {1..30}; do
            if curl -fsS -i --data 'username=admin&password=adminadmin' http://localhost:8080/api/v2/auth/login | grep -qi '^set-cookie:'; then
              exit 0
            fi
            sleep 2
          done
          docker logs qbittorrent
          exit 1

      - name: lint
        run: pnpm run lint

      - name: test
        run: pnpm run test
